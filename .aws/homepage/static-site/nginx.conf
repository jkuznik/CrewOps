server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Kluczowa dyrektywa: W przypadku błędu 404, zwróć zawartość 404.html
    # Użycie '=404' oznacza, że serwer zwróci nagłówek 404, ale treść pliku 404.html.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}