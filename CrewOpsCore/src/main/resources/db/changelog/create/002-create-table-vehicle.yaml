databaseChangeLog:
  - changeSet:
      id: 001-create-type-vehicle-type-enum
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              CREATE TYPE vehicle_type_enum AS ENUM ('TECHNOLOGY_TRUCK', 'WHEEL_LOADER', 'BULLDOZER', 'EXCAVATOR', 'ROLLER', 'SWEEPER', 'SEMI_TRUCK', 'OTHER');

  - changeSet:
      id: 002-create-table-vehicle
      author: jkuznik
      changes:
        - createTable:
            tableName: vehicle
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: vin
                  type: varchar(50)
                  constraints:
                    unique: true
                    nullable: true
              - column:
                  name: make
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: register_number
                  type: varchar(15)
                  constraints:
                    nullable: true
              - column:
                  name: vehicle_type
                  type: vehicle_type_enum
                  constraints:
                    nullable: false
              - column:
                  name: broken
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-vehicle-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS vehicle_updated_at_trigger ON vehicle;
              CREATE TRIGGER vehicle_updated_at_trigger
              BEFORE UPDATE ON vehicle
              FOR EACH ROW
              EXECUTE FUNCTION update_updated_at();