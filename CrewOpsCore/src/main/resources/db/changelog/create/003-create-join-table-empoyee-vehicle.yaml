databaseChangeLog:
  - changeSet:
      id: 001-create-employee-vehicle-table
      author: jkuznik
      changes:
        - createTable:
            tableName: employee_vehicle
            columns:
              - column:
                  name: employee_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: vehicle_id
                  type: uuid
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: employee_vehicle
            baseColumnNames: employee_id
            constraintName: fk_employee_vehicle_employee
            referencedTableName: employee
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: employee_vehicle
            baseColumnNames: vehicle_id
            constraintName: fk_employee_vehicle_vehicle
            referencedTableName: vehicle
            referencedColumnNames: id
            onDelete: CASCADE
