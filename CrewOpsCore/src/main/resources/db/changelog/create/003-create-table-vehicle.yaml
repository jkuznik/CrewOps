databaseChangeLog:
  - changeSet:
      id: 002-create-vehicle-table
      author: jkuznik
      changes:
        - createTable:
            tableName: vehicle
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: vin
                  type: varchar(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: make
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_vehicle_owner
                    references: employee(id)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
