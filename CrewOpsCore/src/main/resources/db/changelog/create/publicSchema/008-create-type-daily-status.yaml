databaseChangeLog:
  - changeSet:
      id: 001-create-daily-entry-status-enum
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'daily_status') THEN
                  CREATE TYPE daily_status AS ENUM ('EMPTY', 'DRAFT', 'PENDING', 'AUTO_GENERATED', 'MANUAL_EDITED', 'APPROVED');
                END IF;
              END;
              $$;