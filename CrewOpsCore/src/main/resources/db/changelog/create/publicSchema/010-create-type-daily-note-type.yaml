databaseChangeLog:
  - changeSet:
      id: 001-create-note-type-enum
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'note_type') THEN
                  CREATE TYPE note_type AS ENUM ('PRIVATE', 'PUBLIC');
                END IF;
              END;
              $$;