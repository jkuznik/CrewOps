databaseChangeLog:
  - changeSet:
      id: 001-create-daily-attendance-enum
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'daily_attendance') THEN
                  CREATE TYPE daily_attendance AS ENUM ('PRESENT', 'VACATION', 'SICK_LEAVE', 'OTHER', 'ABSENT', 'NULL');
                END IF;
              END;
              $$;