databaseChangeLog:
  - changeSet:
      id: 001-create-daily-entry-audit-type-enum
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'daily_entry_event_type') THEN
                  CREATE TYPE daily_entry_event_type AS ENUM ('INFORMATION_MODIFIED', 'UPDATE_JOB_POSITION', 'ATTENDANCE_STATUS_CHANGED', 'SAFETY_NOTE_ADDED', 'REPORT_STATUS_CHANGED', 'OVERTIME_MODIFIED', 'ENTRY_STATUS_CHANGED');
                END IF;
              END;
              $$;