databaseChangeLog:
  - changeSet:
      id: 002-create-employee-table
      author: jkuznik
      changes:
        - createTable:
            tableName: employee
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: first_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: varchar(15)
                  constraints:
                      nullable: true
              - column:
                  name: department
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE employee
              ALTER COLUMN updated_at
              SET DEFAULT CURRENT_TIMESTAMP,
              ALTER COLUMN updated_at
              SET DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP;