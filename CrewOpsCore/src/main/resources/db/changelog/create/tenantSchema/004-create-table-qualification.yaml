databaseChangeLog:
  - changeSet:
      id: 001-create-table-qualification
      author: jkuznik
      changes:
        - createTable:
            tableName: qualification
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: version
                  type: integer
                  constraints:
                    nullable: false
                  defaultValue: 0
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-qualification-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            # source: https://neon.tech/postgresql/postgresql-tutorial/postgresql-timestamp
            sql: |
              DROP TRIGGER IF EXISTS qualification_updated_at_trigger ON qualification;
              CREATE TRIGGER qualification_updated_at_trigger
              BEFORE UPDATE ON qualification
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();
