databaseChangeLog:
  - changeSet:
      id: 001-create-table-message
      author: jkuznik
      changes:
        - createTable:
            tableName: message
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: version
                  type: integer
                  constraints:
                    nullable: false
                  defaultValue: 0
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: description
                  type: varchar(32767)
                  constraints:
                    nullable: false
              - column:
                  name: recipient_employee_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: sender_employee_id
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: is_read
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-message-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS message_updated_at_trigger ON message;
              CREATE TRIGGER message_updated_at_trigger
              BEFORE UPDATE ON message
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();
