databaseChangeLog:
  - changeSet:
      id: 001-create-table-daily-note
      author: jkuznik
      changes:
        - createTable:
            tableName: daily_note
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: daily_entry_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: reported_by_employee_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: public.daily_note_type
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: varchar(32767)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: daily_note
            baseColumnNames: daily_entry_id
            referencedTableName: daily_entry
            referencedColumnNames: id
            constraintName: fk_daily_note_daily_entry
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: daily_note
            baseColumnNames: reported_by_employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_daily_note_reported_by
            onDelete: RESTRICT

  - changeSet:
      id: 002-create-daily_note-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS daily_note_updated_at_trigger ON daily_note;
              CREATE TRIGGER daily_note_updated_at_trigger
              BEFORE UPDATE ON daily_note
              FOR EACH ROW
              EXECUTE FUNCTION update_updated_at();