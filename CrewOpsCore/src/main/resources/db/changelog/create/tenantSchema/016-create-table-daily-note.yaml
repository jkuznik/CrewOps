databaseChangeLog:
  - changeSet:
      id: 001-create-table-note
      author: jkuznik
      changes:
        - createTable:
            tableName: note
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: date
              - column:
                  name: reported_by_employee_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: public.note_type
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: varchar(32767)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: note
            baseColumnNames: reported_by_employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_note_reported_by
            onDelete: RESTRICT

  - changeSet:
      id: 002-create-note-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS note_updated_at_trigger ON note;
              CREATE TRIGGER note_updated_at_trigger
              BEFORE UPDATE ON note
              FOR EACH ROW
              EXECUTE FUNCTION update_updated_at();