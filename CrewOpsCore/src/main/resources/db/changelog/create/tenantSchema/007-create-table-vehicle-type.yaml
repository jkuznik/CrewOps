databaseChangeLog:
  - changeSet:
      id: 001-create-table-vehicle-type
      author: jkuznik
      changes:
        - createTable:
            tableName: vehicle_type
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: version
                  type: integer
                  constraints:
                    nullable: false
                  defaultValue: 0
              - column:
                  name: name
                  type: varchar(31)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-vehicle-vehicle-type-id-foreign-key
      author: jkuznik
      changes:
        - addForeignKeyConstraint:
            baseTableName: vehicle
            baseColumnNames: vehicle_type_id
            referencedTableName: vehicle_type
            referencedColumnNames: id
            constraintName: fk_vehicle_vehicle_type_id
            onDelete: SET NULL

  - changeSet:
      id: 003-create-vehicle-type-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            # source: https://neon.tech/postgresql/postgresql-tutorial/postgresql-timestamp
            sql: |
              DROP TRIGGER IF EXISTS vehicle_type_updated_at_trigger ON vehicle_type;
              CREATE TRIGGER vehicle_type_updated_at_trigger
              BEFORE UPDATE ON vehicle_type
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();