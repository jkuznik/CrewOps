databaseChangeLog:
  - changeSet:
      id: 001-create-table-machine-type
      author: jkuznik
      changes:
        - createTable:
            tableName: machine_type
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: version
                  type: integer
                  constraints:
                    nullable: false
                  defaultValue: 0
              - column:
                  name: name
                  type: varchar(31)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-machine-machine-type-id-foreign-key
      author: jkuznik
      changes:
        - addForeignKeyConstraint:
            baseTableName: machine
            baseColumnNames: machine_type_id
            referencedTableName: machine_type
            referencedColumnNames: id
            constraintName: fk_machine_machine_type_id
            onDelete: SET NULL

  - changeSet:
      id: 003-create-machine-type-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            # source: https://neon.tech/postgresql/postgresql-tutorial/postgresql-timestamp
            sql: |
              DROP TRIGGER IF EXISTS machine_type_updated_at_trigger ON machine_type;
              CREATE TRIGGER machine_type_updated_at_trigger
              BEFORE UPDATE ON machine_type
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();