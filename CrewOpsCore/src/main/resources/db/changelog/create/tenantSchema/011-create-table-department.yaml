databaseChangeLog:
  - changeSet:
      id: 001-create-table-departments
      author: jkuznik
      changes:
        - createTable:
            tableName: department
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: version
                  type: integer
                  constraints:
                    nullable: false
                  defaultValue: 0
              - column:
                  name: name
                  type: varchar(63)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-departments-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS department_updated_at_trigger ON department;
              CREATE TRIGGER department_updated_at_trigger
              BEFORE UPDATE ON department
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();