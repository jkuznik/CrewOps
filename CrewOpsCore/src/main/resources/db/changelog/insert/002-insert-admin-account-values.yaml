databaseChangeLog:
  - changeSet:
      id: 001-create-schema
      author: jkuznik
      changes:
        - sql:
            sql: "CREATE SCHEMA IF NOT EXISTS ${tenant.schema.name};"

  - changeSet:
      id: 002-create-table-employee
      author: jkuznik
      changes:
        - createTable:
            schemaName: ${tenant.schema.name}
            tableName: employee
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false, unique: true } }
              - column: { name: version, type: integer, defaultValue: 0, constraints: { nullable: false } }
              - column: { name: first_name, type: varchar(31), constraints: { nullable: false } }
              - column: { name: last_name, type: varchar(31), constraints: { nullable: false } }
              - column: { name: birth_date, type: date, constraints: { nullable: false } }
              - column: { name: phone_number, type: varchar(15), constraints: { nullable: true } }
              - column: { name: department, type: varchar(63), constraints: { nullable: false } }
              - column: { name: active, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

  - changeSet:
      id: 003-create-employee-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS employee_updated_at_trigger ON ${tenant.schema.name}.employee;
              CREATE TRIGGER employee_updated_at_trigger
              BEFORE UPDATE ON ${tenant.schema.name}.employee
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();

  - changeSet:
      id: 004-create-table-machine
      author: jkuznik
      changes:
        - createTable:
            schemaName: ${tenant.schema.name}
            tableName: machine
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false, unique: true } }
              - column: { name: version, type: integer, defaultValue: 0, constraints: { nullable: false } }
              - column: { name: vin, type: varchar(50), constraints: { unique: true, nullable: true } }
              - column: { name: make, type: varchar(31), constraints: { nullable: false } }
              - column: { name: model, type: varchar(31), constraints: { nullable: false } }
              - column: { name: year, type: int, constraints: { nullable: false } }
              - column: { name: register_number, type: varchar(15), constraints: { nullable: true } }
              - column: { name: machine_type_id, type: uuid }
              - column: { name: broken, type: boolean, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

  - changeSet:
      id: 005-create-machine-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS machine_updated_at_trigger ON ${tenant.schema.name}.machine;
              CREATE TRIGGER machine_updated_at_trigger
              BEFORE UPDATE ON ${tenant.schema.name}.machine
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();
              
  - changeSet:
      id: 006-create-table-employee-machine
      author: jkuznik
      changes:
        - createTable:
            schemaName: ${tenant.schema.name}
            tableName: employee_machine
            columns:
              - column: { name: employee_id, type: uuid, constraints: { nullable: false } }
              - column: { name: machine_id, type: uuid, constraints: { nullable: false } }

        - addPrimaryKey:
            schemaName: ${tenant.schema.name}
            tableName: employee_machine
            columnNames: employee_id, machine_id
            constraintName: pk_employee_machine

        - addForeignKeyConstraint:
            baseTableSchemaName: ${tenant.schema.name}
            baseTableName: employee_machine
            baseColumnNames: employee_id
            constraintName: fk_employee_machine_employee
            referencedTableSchemaName: ${tenant.schema.name}
            referencedTableName: employee
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: ${tenant.schema.name}
            baseTableName: employee_machine
            baseColumnNames: machine_id
            constraintName: fk_employee_machine_machine
            referencedTableSchemaName: ${tenant.schema.name}
            referencedTableName: machine
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 007-create-table-qualification
      author: jkuznik
      changes:
        - createTable:
            schemaName: ${tenant.schema.name}
            tableName: qualification
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false, unique: true } }
              - column: { name: version, type: integer, defaultValue: 0, constraints: { nullable: false } }
              - column: { name: description, type: text, constraints: { nullable: false, unique: true } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

  - changeSet:
      id: 008-create-qualification-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS qualification_updated_at_trigger ON ${tenant.schema.name}.qualification;
              CREATE TRIGGER qualification_updated_at_trigger
              BEFORE UPDATE ON ${tenant.schema.name}.qualification
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();

  - changeSet:
      id: 009-create-table-employee-qualification
      author: jkuznik
      changes:
        - createTable:
            schemaName: ${tenant.schema.name}
            tableName: employee_qualification
            columns:
              - column: { name: employee_id, type: uuid, constraints: { nullable: false } }
              - column: { name: qualification_id, type: uuid, constraints: { nullable: false } }
              - column: { name: expired_at, type: timestamp, constraints: { nullable: true } }

        - addPrimaryKey:
            schemaName: ${tenant.schema.name}
            tableName: employee_qualification
            columnNames: employee_id, qualification_id
            constraintName: pk_employee_qualification

        - addForeignKeyConstraint:
            baseTableSchemaName: ${tenant.schema.name}
            baseTableName: employee_qualification
            baseColumnNames: employee_id
            constraintName: fk_employee_qualification_employee
            referencedTableSchemaName: ${tenant.schema.name}
            referencedTableName: employee
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: ${tenant.schema.name}
            baseTableName: employee_qualification
            baseColumnNames: qualification_id
            constraintName: fk_employee_qualification_qualification
            referencedTableSchemaName: ${tenant.schema.name}
            referencedTableName: qualification
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 010-create-table-breakdown
      author: jkuznik
      changes:
        - createTable:
            schemaName: ${tenant.schema.name}
            tableName: breakdown
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false, unique: true } }
              - column: { name: version, type: integer, defaultValue: 0, constraints: { nullable: false } }
              - column: { name: description, type: varchar(2047), constraints: { nullable: false } }
              - column: { name: machine_id, type: uuid, constraints: { nullable: false } }
              - column: { name: reported_by_id, type: uuid, constraints: { nullable: false } }
              - column: { name: repaired_by_id, type: uuid, constraints: { nullable: true } }
              - column: { name: solved, type: boolean, constraints: { nullable: false } }
              - column: { name: critical, type: boolean, constraints: { nullable: false } }
              - column: { name: solved_at, type: timestamp, constraints: { nullable: true } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableSchemaName: ${tenant.schema.name}
            baseTableName: breakdown
            baseColumnNames: machine_id
            referencedTableSchemaName: ${tenant.schema.name}
            referencedTableName: machine
            referencedColumnNames: id
            constraintName: fk_breakdown_machine
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: ${tenant.schema.name}
            baseTableName: breakdown
            baseColumnNames: reported_by_id
            referencedTableSchemaName: ${tenant.schema.name}
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_breakdown_reported_by
            onDelete: SET NULL

        - addForeignKeyConstraint:
            baseTableSchemaName: ${tenant.schema.name}
            baseTableName: breakdown
            baseColumnNames: repaired_by_id
            referencedTableSchemaName: ${tenant.schema.name}
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_breakdown_repaired_by
            onDelete: SET NULL

  - changeSet:
      id: 011-create-breakdown-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS breakdown_updated_at_trigger ON ${tenant.schema.name}.breakdown;
              CREATE TRIGGER breakdown_updated_at_trigger
              BEFORE UPDATE ON ${tenant.schema.name}.breakdown
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();
              
  - changeSet:
      id: 012-create-table-machine-type
      author: jkuznik
      changes:
        - createTable:
            schemaName: ${tenant.schema.name}
            tableName: machine_type
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false, unique: true } }
              - column: { name: version, type: integer, defaultValue: 0, constraints: { nullable: false } }
              - column: { name: name, type: varchar(31), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableSchemaName: ${tenant.schema.name}
            baseTableName: machine
            baseColumnNames: machine_type_id
            referencedTableSchemaName: ${tenant.schema.name}
            referencedTableName: machine_type
            referencedColumnNames: id
            constraintName: fk_machine_machine_type_id
            onDelete: SET NULL

  - changeSet:
      id: 013-create-machine-type-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS machine_type_updated_at_trigger ON ${tenant.schema.name}.machine_type;
              CREATE TRIGGER machine_type_updated_at_trigger
              BEFORE UPDATE ON ${tenant.schema.name}.machine_type
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();
              
  - changeSet:
      id: 014-create-table-address
      author: jkuznik
      changes:
        - createTable:
            schemaName: ${tenant.schema.name}
            tableName: address
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false, unique: true } }
              - column: { name: version, type: integer, defaultValue: 0, constraints: { nullable: false } }
              - column: { name: postal_code, type: varchar(31), constraints: { nullable: false } }
              - column: { name: city, type: varchar(31), constraints: { nullable: false } }
              - column: { name: street, type: varchar(31), constraints: { nullable: false } }
              - column: { name: local_number, type: varchar(31), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

  - changeSet:
      id: 015-create-address-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS address_updated_at_trigger ON ${tenant.schema.name}.address;
              CREATE TRIGGER address_updated_at_trigger
              BEFORE UPDATE ON ${tenant.schema.name}.address
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();    

  - changeSet:
      id: 016-create-table-company
      author: jkuznik
      changes:
        - createTable:
            schemaName: ${tenant.schema.name}
            tableName: company
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false, unique: true } }
              - column: { name: version, type: integer, constraints: { nullable: true } }
              - column: { name: name, type: varchar(63), constraints: { nullable: false } }
              - column: { name: address_id, type: uuid, constraints: { nullable: false, unique: true } }
              - column: { name: email, type: varchar(255), constraints: { nullable: false, unique: true } }
              - column: { name: status, type: varchar(31), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableName: company
            baseColumnNames: address_id
            constraintName: fk_company_address
            referencedTableName: address
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE
            baseTableSchemaName: ${tenant.schema.name}
            referencedTableSchemaName: ${tenant.schema.name}

  - changeSet:
      id: 017-create-company-updated_at-trigger
      author: jkuznik
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS company_updated_at_trigger ON ${tenant.schema.name}.company;
              CREATE TRIGGER company_updated_at_trigger
              BEFORE UPDATE ON ${tenant.schema.name}.company
              FOR EACH ROW
              EXECUTE FUNCTION public.update_updated_at();

  - changeSet:
      id: 18-create-table-message
      author: jkuznik
      changes:
        - createTable:
            schemaName: ${tenant.schema.name}
            tableName: message
            columns:
              - column: { name: id, type: uuid, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false, unique: true } }
              - column: { name: version, type: integer, defaultValue: 0, constraints: { nullable: false } }
              - column: { name: title, type: varchar(255) }
              - column: { name: description, type: varchar(32767), constraints: { nullable: false } }
              - column: { name: recipient_employee_id, type: uuid, constraints: { nullable: false } }
              - column: { name: sender_employee_id, type: uuid }
              - column: { name: is_read, type: boolean, defaultValueBoolean: false }
              - column: { name: created_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }

  - changeSet:
      id: 018-insert-admin-account-values
      author: jkuznik
      changes:
        - insert:
            schemaName: public
            tableName: tenant
            columns:
              - column:
                  name: id
                  value: ${tenant.id}
              - column:
                  name: version
                  valueNumeric: 0
              - column:
                  name: company_id
                  value: ${tenant.company.id}
              - column:
                  name: schema_name
                  value: ${tenant.schema.name}
              - column:
                  name: tax_id
                  value: ${tenant.tax.id}
              - column:
                  name: active
                  valueBoolean: ${tenant.active}
              - column:
                  name: created_at
                  valueComputed: "NOW()"
              - column:
                  name: updated_at
                  valueComputed: "NOW()"

        - insert:
            schemaName: public
            tableName: auth_user
            columns:
              - column:
                  name: id
                  value: ${auth.user.id}
              - column:
                  name: version
                  value: 0
              - column:
                  name: username
                  value: ${auth.user.username}
              - column:
                  name: password
                  value: ${auth.user.password}
              - column:
                  name: employee_id
                  value: ${auth.user.employee.id}
              - column:
                  name: tenant_id
                  value: ${auth.user.tenant.id}
              - column:
                  name: created_at
                  valueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: updated_at
                  valueComputed: "CURRENT_TIMESTAMP"

        - insert:
            schemaName: public
            tableName: auth_user_role
            columns:
              - column:
                  name: auth_user_id
                  value: ${auth.user.role.auth.user.id}
              - column:
                  name: role_id
                  value: ${auth.user.role.role.id}

        - insert:
            schemaName: ${tenant.schema.name}
            tableName: address
            columns:
              - column:
                  name: id
                  value: ${address.id}
              - column:
                  name: version
                  valueNumeric: 0
              - column:
                  name: postal_code
                  value: ${address.postal.code}
              - column:
                  name: city
                  value: ${address.city}
              - column:
                  name: street
                  value: ${address.street}
              - column:
                  name: local_number
                  value: ${address.local.number}
              - column:
                  name: created_at
                  valueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: updated_at
                  valueComputed: "CURRENT_TIMESTAMP"

        - insert:
            schemaName: ${tenant.schema.name}
            tableName: company
            columns:
              - column:
                  name: id
                  value: ${company.id}
              - column:
                  name: version
                  valueNumeric: 0
              - column:
                  name: name
                  value: ${company.name}
              - column:
                  name: address_id
                  value: ${company.address.id}
              - column:
                  name: email
                  value: ${company.email}
              - column:
                  name: status
                  value: ${company.status}
              - column:
                  name: created_at
                  valueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: updated_at
                  valueComputed: "CURRENT_TIMESTAMP"

        - insert:
            schemaName: ${tenant.schema.name}
            tableName: employee
            columns:
              - column:
                  name: id
                  value: ${employee.id}
              - column:
                  name: version
                  valueNumeric: 0
              - column:
                  name: first_name
                  value: ${employee.first.name}
              - column:
                  name: last_name
                  value: ${employee.last.name}
              - column:
                  name: birth_date
                  value: ${employee.birth.date}
              - column:
                  name: phone_number
                  value: ${employee.phone.number}
              - column:
                  name: department
                  value: admin
              - column:
                  name: active
                  value: true
              - column:
                  name: created_at
                  valueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: updated_at
                  valueComputed: "CURRENT_TIMESTAMP"