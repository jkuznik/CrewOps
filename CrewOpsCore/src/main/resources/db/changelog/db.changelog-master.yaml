  databaseChangeLog:
    - changeSet:
        id: 001-initial-config
        author: jkuznik
    - changeSet:
        id: 002-create-update_updated_at-function
        author: jkuznik
        changes:
            - sql:
                dbms: postgresql
                #   source: https://docs.liquibase.com/change-types/sql.html#yaml_example
                endDelimiter: \nGO
                splitStatements: true
                #   source: https://neon.tech/postgresql/postgresql-tutorial/postgresql-timestamp
                sql: |
                    CREATE OR REPLACE FUNCTION update_updated_at() RETURNS TRIGGER AS $$
                        BEGIN 
                            NEW.updated_at = current_timestamp;
                            RETURN NEW;
                        END;
                    $$ LANGUAGE plpgsql;

    - include:
          file: db/changelog/create/publicSchema/001-create-table-role.yaml
    - include:
          file: db/changelog/create/publicSchema/002-create-table-auth-user.yaml
    - include:
          file: db/changelog/create/publicSchema/003-create-join-table-auth-user-role.yaml

