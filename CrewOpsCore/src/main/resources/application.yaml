logging:
  level:
#    Show bind information for each query generated by hibernate
    org.hibernate.orm.jdbc.bind: TRACE

spring:
  application:
    name: CrewOps Core

  profiles:
    active: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true

security:
  properties:
    clientId: $2a$10$EBwUzL.tHIhaQMz63oJkm.ZjEVSsOhvIlAcKKoP/DpYvQYjhdl7mG
    clientIdInput: a
    jwtSecret: ${JWT_CREWOPS}
    jwtExpiration: 300