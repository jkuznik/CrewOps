spring:
  application:
    name: CrewOps Core

  profiles:
    default: dev

  config:
    import:
      - classpath:application-liquibase.yaml
      - classpath:application-email-config.yaml

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

security:
  properties:
    clientId: ${CREWOPS_CLIENT_ID_HASH}
    clientIdInput: ${CREWOPS_CLIENT_ID_INPUT}
    jwtSecret: ${JWT_CREWOPS}
    jwtExpiration: ${JWT_EXPIRATION_CREWOPS}