logging:
  level:
#    Show bind information for each query generated by hibernate
    org.hibernate.orm.jdbc.bind: TRACE

spring:
  application:
    name: CrewOpsCore

  profiles:
    active: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect:  org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.yaml