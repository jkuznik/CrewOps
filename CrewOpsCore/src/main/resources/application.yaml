logging:
  level:
#    Show bind information for each query generated by hibernate
    org.hibernate.orm.jdbc.bind: TRACE

spring:
  application:
    name: CrewOps Core

  profiles:
    active: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true

security:
  properties:
    clientId: temporary-plain-text
    jwtSecret: ${JWT_CREWOPS}
    jwtExpiration: 1200
    jwtRefreshTokenExpiration: 7