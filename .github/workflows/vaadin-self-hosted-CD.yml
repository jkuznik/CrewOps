name: Run Vaadin container on host

on:
  workflow_run:
    workflows: ["Build And Push vaadin image"]
    types:
      - completed

jobs:
  deploy-vaadin:
    runs-on: [self-hosted, linux]
    steps:
#      - name: Pull latest Vaadin image
#        run: sudo docker pull jkuznik/crewops-vaadin:latest

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}

      - name: Authenticate Docker to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/jkuznik-ecr/crewops-vaadin"
          aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_URI

      - name: Pull latest image from ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/jkuznik-ecr/crewops-vaadin"
          sudo docker pull $ECR_URI:latest

      - name: Remove old Vaadin container
        run: sudo docker rm -f CrewOpsVaadin || true

      - name: Run new Vaadin container
        env:
          CREWOPS_CLIENT_ID_INPUT: ${{ secrets.CREWOPS_CLIENT_ID_INPUT }}
          CREWOPS_CLIENT_ID_HASH: ${{ secrets.CREWOPS_CLIENT_ID_HASH }}
          JWT_CREWOPS: ${{ secrets.JWT_CREWOPS }}
          JWT_EXPIRATION_CREWOPS: ${{ secrets.JWT_EXPIRATION_CREWOPS }}
        run: |          
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/jkuznik-ecr/crewops-vaadin"

          sudo docker run -d \
            --name CrewOpsVaadin \
            --network crewOps \
            --restart always \
            -e CREWOPS_CLIENT_ID_INPUT=$CREWOPS_CLIENT_ID_INPUT \
            -e CREWOPS_CLIENT_ID_HASH=$CREWOPS_CLIENT_ID_HASH \
            -e JWT_CREWOPS=$JWT_CREWOPS \
            -e JWT_EXPIRATION_CREWOPS=$JWT_EXPIRATION_CREWOPS \
            -e TZ=Europe/Warsaw \
            -p 8081:8081 \
            --memory=2048m \
            $ECR_URI:latest