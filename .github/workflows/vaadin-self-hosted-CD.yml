name: Run Vaadin container on host

on:
  workflow_run:
    workflows: ["Build And Push vaadin image"]
    types:
      - completed

jobs:
  deploy-vaadin:
    runs-on: [self-hosted, linux]

    steps:
      - name: Pull latest Vaadin image
        run: sudo docker pull jkuznik/crewops-vaadin:latest

      - name: Remove old Vaadin container
        run: sudo docker rm -f CrewOpsVaadin || true

      - name: Run new Vaadin container
        env:
          CREWOPS_CLIENT_ID_INPUT: ${{ secrets.CREWOPS_CLIENT_ID_INPUT }}
          CREWOPS_CLIENT_ID_HASH: ${{ secrets.CREWOPS_CLIENT_ID_HASH }}
          JWT_CREWOPS: ${{ secrets.JWT_CREWOPS }}
          JWT_EXPIRATION_CREWOPS: ${{ secrets.JWT_EXPIRATION_CREWOPS }}
        run: |
          sudo docker run -d \
            --name CrewOpsVaadin \
            --network crewOps \
            --restart always \
            -e CREWOPS_CLIENT_ID_INPUT=$CREWOPS_CLIENT_ID_INPUT \
            -e CREWOPS_CLIENT_ID_HASH=$CREWOPS_CLIENT_ID_HASH \
            -e JWT_CREWOPS=$JWT_CREWOPS \
            -e JWT_EXPIRATION_CREWOPS=$JWT_EXPIRATION_CREWOPS \
            -e TZ=Europe/Warsaw \
            -p 8081:8081 \
            --memory=2048m \
            jkuznik/crewops-vaadin:latest