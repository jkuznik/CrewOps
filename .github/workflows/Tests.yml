name: Java CI with Gradle

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      # Cache Gradle files for faster builds
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Cache Vaadin & Node dependencies (optional but speeds up a lot)
      - name: Cache Vaadin & Node
        uses: actions/cache@v3
        with:
          path: |
            ~/.vaadin
            **/node_modules
          key: vaadin-${{ runner.os }}-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml') }}
          restore-keys: vaadin-${{ runner.os }}-

      # Build with Gradle (skip Vaadin frontend on PRs)
      - name: Build with Gradle (skip Vaadin frontend for PR)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build --build-cache --parallel --no-daemon -x vaadinBuildFrontend
          gradle-version: 8.12.1
