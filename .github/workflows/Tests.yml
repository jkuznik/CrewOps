name: Java CI with Gradle

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 23 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'corretto'

      # Cache Gradle files for faster builds
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-1
          key: gradle-deps-${{ hashFiles('**/build.gradle*', '**/settings.gradle*') }}
          restore-keys: gradle-deps-


      # Ensure the cache directories exist
      - name: Ensure Vaadin/Node cache dirs exist
        run: |
          mkdir -p ~/.vaadin
          mkdir -p ./CrewOpsVaadin/node_modules

      # Cache Vaadin & Node dependencies
      - name: Cache Vaadin & Node
        uses: actions/cache@v3
        with:
          path: |
            ~/.vaadin
            ./CrewOpsVaadin/node_modules
          key: vaadin-${{ runner.os }}-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml') }}
          restore-keys: vaadin-${{ runner.os }}-

      # Pre-install Gradle to avoid download every time
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.12.1

      # Build with Gradle (skip Vaadin frontend for PRs)
      - name: Build with Gradle
        run: ./gradlew build --build-cache --parallel --no-daemon -x vaadinBuildFrontend
