name: Java CI with Gradle

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      # Cache Gradle wrapper distributions
      - name: Cache Gradle Wrapper
        uses: actions/cache@v3
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-

      # Cache Gradle dependencies
      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-1
          key: gradle-deps-${{ hashFiles('**/build.gradle*', '**/settings.gradle*') }}
          restore-keys: gradle-deps-

      # Optional: cache Gradle build cache
      - name: Cache Gradle Build Cache
        uses: actions/cache@v3
        with:
          path: ~/.gradle/build-cache
          key: gradle-build-cache-${{ github.sha }}
          restore-keys: gradle-build-cache-

      - name: Build with Gradle
        run: ./gradlew build --build-cache --parallel --no-daemon
