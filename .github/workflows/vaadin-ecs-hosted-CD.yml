name: Deploy Vaadin to ECS

#on:
#  workflow_run:
#    workflows: ["Build And Push vaadin image"]
#    types:
#      - completed

on:
  push:
    branches: [ "main" ]
    paths:
      - 'CrewOpsCore/**'
      - '.docker/core.dockerfile'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/**'

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: jkuznik-ecr/crewops-vaadin
  ECS_SERVICE: crewops-vaadin-service
  ECS_CLUSTER: crewopc-basic-cluster
  ECS_TASK_FAMILY: crewops-vaadin
  CONTAINER_NAME: crewops-vaadin-container

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Vaadin
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ECS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "👉 Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -f $GITHUB_WORKSPACE/.docker/vaadin.dockerfile $GITHUB_WORKSPACE
          echo "👉 Pushing Docker image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fetch latest ECS task definition
        id: fetch-task
        run: |
          set -euo pipefail
          FAMILY="${{ env.ECS_TASK_FAMILY }}"
          echo "👉 Fetching latest task definition for family: $FAMILY"

          LATEST_TASK_DEF_ARN=$(aws ecs list-task-definitions \
            --family-prefix "$FAMILY" \
            --sort DESC \
            --max-items 1 \
            --query 'taskDefinitionArns[0]' \
            --output text)

          LATEST_TASK_DEF_ARN=$(echo "$LATEST_TASK_DEF_ARN" | sed 's/None//g' | xargs)

          if [ -z "$LATEST_TASK_DEF_ARN" ]; then
            echo "❌ No task definitions found for family $FAMILY"
            exit 1
          fi

          echo "✅ Latest task definition ARN: $LATEST_TASK_DEF_ARN"

          aws ecs describe-task-definition \
            --task-definition "$LATEST_TASK_DEF_ARN" \
            --query "taskDefinition" \
            --output json > latest-task-def.json

      # --- CLEAN TASK DEFINITION JSON ---
      - name: Clean task definition for ECS deploy
        id: clean-task
        run: |
          jq '{
            family,
            taskRoleArn,
            executionRoleArn,
            networkMode,
            containerDefinitions,
            volumes,
            placementConstraints,
            requiresCompatibilities,
            cpu,
            memory,
            runtimePlatform
          }' latest-task-def.json > cleaned-task-def.json

      - name: Render new task definition with updated image
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: cleaned-task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

