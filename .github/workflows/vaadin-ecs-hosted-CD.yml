name: Run Vaadin container on host

on:
  workflow_run:
    workflows: ["Build And Push vaadin image"]
    types:
      - completed

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: jkuznik-ecr/crewops-vaadin
  ECS_SERVICE: crewops-vaadin-service
  ECS_CLUSTER: crewopc-basic-cluster
  ECS_TASK_DEFINITION: crewops-vaadin
  ECS_TASK_DEFINITION_FILE: ecs-task-def.json
  CONTAINER_NAME: crewops-vaadin-container

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ECS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -f $GITHUB_WORKSPACE/.docker/vaadin.dockerfile $GITHUB_WORKSPACE
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fetch latest ECS task definition
        id: fetch-task-def
        run: |
          echo "Fetching latest task definition for family: $ECS_TASK_DEFINITION"

          LATEST_TASK_DEF_ARN=$(aws ecs list-task-definitions \
            --family-prefix "$ECS_TASK_DEFINITION" \
            --sort DESC \
            --max-items 1 \
            --query 'taskDefinitionArns[0]' \
            --output text)

          if [ -z "$LATEST_TASK_DEF_ARN" ] || [ "$LATEST_TASK_DEF_ARN" == "None" ]; then
            echo "No task definitions found for family $ECS_TASK_DEFINITION"
            exit 1
          fi

          echo "Latest task definition ARN: $LATEST_TASK_DEF_ARN"
          LATEST_TASK_DEF=$(basename "$LATEST_TASK_DEF_ARN")

          aws ecs describe-task-definition \
            --task-definition "$LATEST_TASK_DEF" \
            --query "taskDefinition" \
            --output json > $ECS_TASK_DEFINITION_FILE

          echo "task-def-file=$ECS_TASK_DEFINITION_FILE" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.fetch-task-def.outputs.task-def-file }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
