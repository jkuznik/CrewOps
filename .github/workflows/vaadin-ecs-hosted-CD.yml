name: Deploy Vaadin to ECS

on:
  push:
    branches: [ "main" ]
    paths:
      - 'CrewOpsVaadin/**'
      - '.docker/vaadin.dockerfile'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/**'

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: jkuznik-ecr/crewops-vaadin
  ECS_SERVICE: crewops-vaadin-service
  ECS_CLUSTER: crewopc-basic-cluster
  ECS_TASK_FAMILY: crewops-vaadin
  CONTAINER_NAME: crewops-vaadin-container

jobs:
  deploy:
    name: Deploy Vaadin
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Set up Amazon Corretto 21
      - name: Set up Java 21 (Amazon Corretto)
        uses: actions/setup-java@v3
        with:
          distribution: corretto
          java-version: 21

      # Set up Node.js for Vaadin frontend
      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Cache Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # Build dependent modules
      - name: Build CrewOpsModel & CrewOpsSecurity
        run: ./gradlew :CrewOpsModel:build :CrewOpsSecurity:build

      # Prepare Vaadin frontend in production mode
      - name: Vaadin Prepare Frontend
        run: ./gradlew :CrewOpsVaadin:vaadinPrepareFrontend -Pproduction

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ECS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Build and push Docker image
      - name: Build & Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_TAG=${GITHUB_SHA}
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"

          echo "👉 Building Docker image..."
          ./gradlew :CrewOpsVaadin:bootBuildImage --imageName="$IMAGE_URI" -Pproduction

          echo "👉 Pushing Docker image to ECR..."
          docker push "$IMAGE_URI"

          echo "✅ Image pushed: $IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # Fetch latest ECS task definition
      - name: Fetch latest ECS task definition
        id: fetch-task
        run: |
          set -euo pipefail
          FAMILY="${{ env.ECS_TASK_FAMILY }}"
          echo "👉 Fetching latest task definition for family: $FAMILY"

          LATEST_TASK_DEF_ARN=$(aws ecs list-task-definitions \
            --family-prefix "$FAMILY" \
            --sort DESC \
            --max-items 1 \
            --query 'taskDefinitionArns[0]' \
            --output text)

          LATEST_TASK_DEF_ARN=$(echo "$LATEST_TASK_DEF_ARN" | sed 's/None//g' | tr -d '[:space:]')

          if [ -z "$LATEST_TASK_DEF_ARN" ]; then
            echo "❌ No task definitions found for family $FAMILY"
            exit 1
          fi

          LATEST_TASK_DEF=$(basename "$LATEST_TASK_DEF_ARN")
          aws ecs describe-task-definition \
            --task-definition "$LATEST_TASK_DEF" \
            --region "${{ env.AWS_REGION }}" \
            --query "taskDefinition" \
            --output json > crewops-vaadin-latest-task-definition.json

          echo "✅ Task definition saved."

      # Update ECS task definition with new image
      - name: Modify ECS task definition with new image
        run: |
          set -euo pipefail
          jq --arg IMAGE "$IMAGE_URI" \
             --arg NAME "${{ env.CONTAINER_NAME }}" \
             '.containerDefinitions |= map(if .name==$NAME then .image=$IMAGE else . end)' \
             crewops-vaadin-latest-task-definition.json \
             > updated-vaadin-task-def.json
          echo "✅ Task definition updated with new image."

      # Register and deploy ECS task definition
      - name: Register and deploy ECS task definition
        run: |
          set -euo pipefail
          CLEAN_TASK_FILE="task-to-register.json"
          jq '{
            family,
            taskRoleArn,
            executionRoleArn,
            networkMode,
            containerDefinitions,
            volumes,
            placementConstraints,
            requiresCompatibilities,
            cpu,
            memory,
            runtimePlatform
          } + (if .enableFaultInjection != null then {enableFaultInjection:.enableFaultInjection} else {} end)
            + (if .pidMode != null then {pidMode:.pidMode} else {} end)
            + (if .ipcMode != null then {ipcMode:.ipcMode} else {} end)
            + (if .proxyConfiguration != null then {proxyConfiguration:.proxyConfiguration} else {} end)
            + (if .inferenceAccelerators != null then {inferenceAccelerators:.inferenceAccelerators} else {} end)
            + (if .ephemeralStorage != null then {ephemeralStorage:.ephemeralStorage} else {} end)
          ' updated-vaadin-task-def.json > "$CLEAN_TASK_FILE"

          REGISTER_OUTPUT=$(aws ecs register-task-definition \
            --cli-input-json file://"$CLEAN_TASK_FILE" \
            --region "${{ env.AWS_REGION }}")

          NEW_TASK_DEF_ARN=$(echo "$REGISTER_OUTPUT" | jq -r '.taskDefinition.taskDefinitionArn')
          echo "✅ New task definition registered: $NEW_TASK_DEF_ARN"

          echo "👉 Updating ECS service..."
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

          echo "✅ ECS service deployment triggered successfully."

          # Cleanup
          rm -f "$CLEAN_TASK_FILE" updated-vaadin-task-def.json crewops-vaadin-latest-task-definition.json
          echo "✅ Cleanup done."

