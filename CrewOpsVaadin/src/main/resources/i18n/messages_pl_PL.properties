#   CONTENTS
infoContent.limitedFunctionalityNotice=\u26A0\uFE0F Uwaga \u2013 ograniczona funkcjonalno\u015B\u0107 aplikacji\nZ powodu ogranicze\u0144 darmowej instancji EC2 (dok\u0142adnie 1 GB dost\u0119pnej pami\u0119ci RAM), aplikacja nie dzia\u0142a obecnie poprawnie. Modu\u0142 backendu (Spring Boot) nie jest uruchomiony, co uniemo\u017Cliwia logowanie i prezentacj\u0119 g\u0142\u00F3wnego procesu aplikacji.\n\nAplikacja zosta\u0142a zaprojektowana jako system z\u0142o\u017Cony z trzech niezale\u017Cnych, ale wsp\u00F3\u0142pracuj\u0105cych modu\u0142\u00F3w:\n\nfrontend (Vaadin) \u2013 interfejs u\u017Cytkownika,\n\nbackend (Spring Boot) \u2013 logika aplikacji i komunikacja z baz\u0105 danych,\n\nPostgreSQL \u2013 baza danych dzia\u0142aj\u0105ca w osobnym kontenerze.\n\nTe trzy serwisy s\u0105 niezb\u0119dne do poprawnego dzia\u0142ania ca\u0142o\u015Bci \u2013 ich rozdzielenie i konteneryzacja (Docker) pozwala na \u0142atwiejsze wdra\u017Canie, testowanie oraz rozw\u00F3j ka\u017Cdego komponentu niezale\u017Cnie. Wdro\u017Cono tak\u017Ce mechanizmy cachowania w celu zwi\u0119kszenia wydajno\u015Bci (np. dla danych sesyjnych).\n\nZ powodu ograniczonych zasob\u00F3w musia\u0142em tymczasowo zrezygnowa\u0107 z uruchomienia backendu \u2013 EC2 nie dysponuje wystarczaj\u0105c\u0105 ilo\u015Bci\u0105 pami\u0119ci RAM.\n\nZ przyjemno\u015Bci\u0105 udziel\u0119 dost\u0119pu do prywatnego repozytorium GitHub, aby umo\u017Cliwi\u0107 zapoznanie si\u0119 z kodem oraz zastosowanymi rozwi\u0105zaniami.\nProjekt wystartowa\u0142 w marcu 2025 \u2013 prace nad rozwojem i optymalizacj\u0105 aplikacji s\u0105 ca\u0142y czas w toku.\nPrzepraszam za utrudnienia.
infoContent.systemDescription=System zosta\u0142 zaprojektowany w oparciu o wielomodu\u0142ow\u0105 architektur\u0119, umo\u017Cliwiaj\u0105c\u0105 logiczne rozdzielenie odpowiedzialno\u015Bci oraz \u0142atwiejsze zarz\u0105dzanie kodem. Ka\u017Cdy modu\u0142 odpowiada za wyra\u017Anie zdefiniowany obszar funkcjonalny, dzi\u0119ki czemu mo\u017Cliwa jest niezale\u017Cna praca nad ró\u017Cnymi cz\u0119\u015Bciami systemu oraz ich \u0142atwe testowanie i utrzymywanie. Podej\u015Bcie to wspiera skalowalno\u015B\u0107 i rozwój projektu w d\u0142u\u017Cszej perspektywie.
infoContent.vaadinDescription=W warstwie prezentacji zastosowano podej\u015Bcie komponentowe oparte na frameworku Vaadin. Kluczowe widoki i funkcje u\u017Cytkownika s\u0105 budowane z u\u017Cyciem reu\u017Cywalnych komponentów, które zawieraj\u0105 zarówno logik\u0119 interfejsu, jak i spójny wygl\u0105d. Takie podej\u015Bcie u\u0142atwia utrzymanie jednolitego stylu graficznego w ca\u0142ej aplikacji oraz przyspiesza implementacj\u0119 kolejnych funkcjonalno\u015Bci.
infoContent.additionalDescription=W systemie zastosowano równie\u017C mechanizmy uwierzytelniania oparte na JWT token oraz efektywne cachowanie, co przek\u0142ada si\u0119 na bezpiecze\u0144stwo i wydajno\u015B\u0107 aplikacji.
infoContent.testsDescription=Na bie\u017c\u0105co dodawane i utrzymywane s\u0105 testy kluczowych funkcji systemu.
infoContent.moduleDescription=Wielomodu\u0142owa struktura pozwala na lepsze zarz\u0105dzanie zale\u017cno\u015bciami, co zapewnia sp\u00f3jno\u015b\u0107 rozwi\u0105za\u0144 w niezale\u017cnych modu\u0142ach.
infoContent.gitDescription=Repozytorium GitHub jest wykorzystywane do organizacji pracy poprzez listy zada\u0144 (ToDo) oraz powi\u0105zane z nimi zg\u0142oszenia (issues), co pozwala na sprawn\u0105 synchronizacj\u0119 i kontrol\u0119 post\u0119pu prac.

homeContent.title=CrewOps \u2013 sprawne zarz\u0105dzanie zespo\u0142ami i sprz\u0119tem w terenie
homeContent.intro=Aplikacja zosta\u0142a zaprojektowana z my\u015bl\u0105 o usprawnieniu codziennej pracy technicznych za\u0142\u00f3g pracowniczych oraz skutecznym monitorowaniu dost\u0119pno\u015bci sprz\u0119tu ci\u0119\u017ckiego.
homeContent.feature1=Zarz\u0105dzanie za\u0142ogami pracowniczymi \u2013 mo\u017cliwo\u015b\u0107 przypisywania pracownik\u00f3w do konkretnych zmian, zespo\u0142\u00f3w roboczych lub maszyn. System umo\u017cliwia \u015bledzenie dost\u0119pno\u015bci kadry w czasie rzeczywistym.
homeContent.feature2=Monitoring i ewidencja maszyn \u2013 przegl\u0105d aktualnie dost\u0119pnych, przypisanych lub wy\u0142\u0105czonych z u\u017cytku maszyn.
homeContent.feature3=Zg\u0142aszanie i rejestracja awarii \u2013 u\u017cytkownicy mog\u0105 zg\u0142asza\u0107 usterki techniczne maszyn bezpo\u015brednio z poziomu aplikacji. Ka\u017cde zg\u0142oszenie trafia do rejestru usterek, gdzie mo\u017cna \u015bledzi\u0107 jego status i histori\u0119 napraw.
homeContent.feature4=Panel administracyjny \u2013 pe\u0142na kontrola nad uprawnieniami u\u017cytkownik\u00f3w, widokiem systemu, logami dzia\u0142a\u0144.
homeContent.feature5=Obecnie dost\u0119pna przez przegl\u0105dark\u0119 internetow\u0105. Wersja mobilna na smartfony \u2013 w przygotowaniu.
homeContent.loginInfo=Dane logowania \u2013 konta przyk\u0142adowe:
homeContent.credentials=admin / admin<br>user / user<br><br>Oba konta obecnie maj\u0105 pe\u0142ne uprawnienia, umo\u017cliwiaj\u0105ce testowanie wszystkich funkcji systemu.

