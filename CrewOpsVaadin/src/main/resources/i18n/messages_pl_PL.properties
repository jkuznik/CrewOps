scheduleContent.shiftBasedGenerator=Tryb planowania d\u0142ugoterminowego grafiku dla ca\u0142ej kadry jednocze\u015Bnie. Elastyczne narz\u0119dzie bazuje na przygotowanych szablonach zmian. Aby skorzysta\u0107 z tego trybu wymagane jest wcze\u015Bniejsze zdefiniowanie stanowisk pracy. W ka\u017Cdym szablonie zmiany/zespo\u0142u mo\u017Cliwe jest przypisanie domy\u015Blnego pracownika.
scheduleContent.individualGenerator=scheduleContent.individualGenerator=Tryb planowania grafiku dla pojedynczego pracownika. Umo\u017Cliwia szczeg\u00f3\u0142owe zarz\u0105dzanie jego dyspozycyjno\u015Bci\u0105, wnioskami urlopowymi, chorobowym i tworzenie grafiku na podstawie zdefiniowanych stanowisk pracy i zmian.

