homeView.title=\uD83D\uDE80 CrewOps \u2013 zarz\u0105dzanie za\u0142og\u0105, flot\u0105 i awariami w jednym miejscu\n\nCrewOps to nowoczesna aplikacja webowa stworzona z my\u015Bl\u0105 o firmach operuj\u0105cych pojazdami i zespo\u0142ami technicznymi. Umo\u017Cliwia sprawne zarz\u0105dzanie pracownikami, pojazdami oraz zg\u0142oszeniami usterek w czasie rzeczywistym.\n\n\uD83D\uDC77\u200D\u2642\uFE0F Zarz\u0105dzanie pracownikami \u2013 przegl\u0105daj kwalifikacje i przypisuj zadania.\n\uD83D\uDE9B Ewidencja floty \u2013 monitoruj pojazdy oraz ich status.\n\u26A0\uFE0F Zg\u0142aszanie i obs\u0142uga awarii \u2013 rejestruj usterki i \u015Bled\u017A post\u0119p napraw.\n\uD83D\uDD10 Bezpieczne logowanie i sesje \u2013 wykorzystanie token\u00F3w JWT i automatyczne wylogowanie po wyga\u015Bni\u0119ciu sesji.\n\nCrewOps wspiera codzienn\u0105 prac\u0119 Twojego zespo\u0142u, pomagaj\u0105c skupi\u0107 si\u0119 na tym, co naprawd\u0119 wa\u017Cne.

