#   VIEWS

homeView.title=\uD83D\uDE80 CrewOps \u2013 Verwaltung von Team, Fuhrpark und St\u00F6rungen an einem Ort\n\nCrewOps ist eine moderne Webanwendung f\u00FCr Unternehmen mit Fahrzeugflotten und technischen Teams. Sie erm\u00F6glicht die effiziente Verwaltung von Mitarbeitern, Fahrzeugen und St\u00F6rungsmeldungen in Echtzeit.\n\n\uD83D\uDC77\u200D\u2642\uFE0F Mitarbeiterverwaltung \u2013 Qualifikationen einsehen und Aufgaben zuweisen.\n\uD83D\uDE9B Fuhrparkverwaltung \u2013 Fahrzeuge und deren Status \u00FCberwachen.\n\u26A0\uFE0F St\u00F6rungsmeldung und -bearbeitung \u2013 Defekte melden und Reparaturfortschritt verfolgen.\n\uD83D\uDD10 Sicheres Login und Sitzungen \u2013 Nutzung von JWT-Tokens und automatisches Abmelden nach Ablauf der Sitzung.\n\nCrewOps unterst\u00FCtzt die t\u00E4gliche Arbeit Ihres Teams und hilft, sich auf das Wesentliche zu konzentrieren.

