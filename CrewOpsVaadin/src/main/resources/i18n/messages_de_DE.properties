#   CONTENTS
infoContent.limitedFunctionalityNotice=\u26A0\uFE0F Achtung \u2013 eingeschränkte Funktionalität der Anwendung\nAufgrund der Einschränkungen der kostenlosen EC2-Instanz (genau 1 GB verfügbarer RAM) funktioniert die Anwendung derzeit nicht richtig. Das Backend-Modul (Spring Boot) ist nicht aktiv, was die Anmeldung und die Darstellung des Hauptprozesses der Anwendung verhindert.\n\nDie Anwendung wurde als System entworfen, das aus drei unabhängigen, aber zusammenarbeitenden Modulen besteht:\n\nFrontend (Vaadin) \u2013 Benutzeroberfläche,\n\nBackend (Spring Boot) \u2013 Anwendungslogik und Datenbankkommunikation,\n\nPostgreSQL \u2013 Datenbank, die in einem separaten Container läuft.\n\nDiese drei Dienste sind für das ordnungsgemäße Funktionieren des Gesamtsystems unverzichtbar \u2013 ihre Trennung und Containerisierung (Docker) ermöglicht eine einfachere Bereitstellung, Tests und unabhängige Entwicklung jedes einzelnen Bestandteils. Es wurden auch Caching-Mechanismen zur Leistungssteigerung implementiert (z.B. für Sitzungsdaten).\n\nAufgrund begrenzter Ressourcen musste ich vorübergehend auf den Betrieb des Backends verzichten \u2013 EC2 verfügt nicht über ausreichend RAM.\n\nGern stelle ich Zugriff auf das private GitHub-Repository zur Verfügung, um einen Einblick in den Code und die angewandten Lösungen zu ermöglichen.\nDas Projekt startete im März 2025 ? die Entwicklungs- und Optimierungsarbeiten sind im Gange.\nEntschuldigung für die Unannehmlichkeiten.
infoContent.systemDescription=Das System wurde auf einer Multi-Modul-Architektur entworfen, die eine klare Trennung von Verantwortlichkeiten und eine einfachere Codeverwaltung ermöglicht. Jedes Modul ist für einen klar definierten Funktionsbereich zuständig, wodurch eine unabhängige Entwicklung und Wartung einzelner Systemkomponenten ermöglicht wird. Dieser Ansatz fördert die Skalierbarkeit und langfristige Entwicklung des Projekts.
infoContent.vaadinDescription=In der Präsentationsschicht wird ein komponentenbasierter Ansatz mit dem Vaadin-Framework verwendet. Wichtige Benutzeransichten und Funktionen werden mit wiederverwendbaren Komponenten erstellt, die sowohl die Benutzeroberflächenlogik als auch ein konsistentes Erscheinungsbild enthalten. Dies erleichtert die Einhaltung eines einheitlichen Designs und beschleunigt die Implementierung neuer Funktionen.
infoContent.additionalDescription=Das System verwendet moderne Authentifizierungsmechanismen auf Basis von JWT-Tokens sowie effektives Caching, was zur Sicherheit und Leistungsfähigkeit der Anwendung beiträgt.
infoContent.testsDescription=Schlüsselfunktionen des Systems werden kontinuierlich getestet und gewartet.
infoContent.moduleDescription=Eine Multimodul-Struktur ermöglicht eine bessere Abhängigkeitsverwaltung und sorgt für Konsistenz der Lösungen in unabhängigen Modulen.
infoContent.gitDescription=Das GitHub-Repository wird verwendet, um die Arbeit über Aufgabenlisten (ToDo) und verknüpfte Issues zu organisieren, was eine effiziente Synchronisierung und Fortschrittskontrolle ermöglicht.

homeContent.title=CrewOps \u2013 effizientes Management von Teams und Maschinen im Einsatz
homeContent.intro=Die Anwendung wurde entwickelt, um den Alltag technischer Teams zu erleichtern und die Verfügbarkeit von Maschinen auf Baustellen und in Industrieanlagen zu überwachen.
homeContent.feature1=Personalverwaltung \u2013 Zuordnung von Mitarbeitern zu Schichten, Teams oder Maschinen. Das System ermöglicht die Verfolgung der Verfügbarkeit in Echtzeit.
homeContent.feature2=Maschinenüberwachung und -erfassung \u2013 Überblick über verfügbare, zugewiesene oder außer Betrieb genommene Maschinen.
homeContent.feature3=Störungsmeldung \u2013 Benutzer können Maschinenfehler direkt über die App melden. Jede Meldung wird protokolliert und der Reparaturverlauf kann nachverfolgt werden.
homeContent.feature4=Admin-Panel \u2013 vollständige Kontrolle über Benutzerrechte, Systemansichten und Protokolle.
homeContent.feature5=Derzeit über den Webbrowser verfügbar. Mobile Version für Smartphones \u2013 in Vorbereitung.
