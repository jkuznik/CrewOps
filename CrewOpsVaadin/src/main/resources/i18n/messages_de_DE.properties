#   CONTENTS
infoContent.limitedFunctionalityNotice=\u26A0\uFE0F Achtung \u2013 eingeschr\u00E4nkte Funktionalit\u00E4t der Anwendung\nAufgrund der Einschr\u00E4nkungen der kostenlosen EC2-Instanz (genau 1 GB verf\u00FCgbarer RAM) funktioniert die Anwendung derzeit nicht richtig. Das Backend-Modul (Spring Boot) ist nicht aktiv, was die Anmeldung und die Darstellung des Hauptprozesses der Anwendung verhindert.\n\nDie Anwendung wurde als System entworfen, das aus drei unabh\u00E4ngigen, aber zusammenarbeitenden Modulen besteht:\n\nFrontend (Vaadin) \u2013 Benutzeroberfl\u00E4che,\n\nBackend (Spring Boot) \u2013 Anwendungslogik und Datenbankkommunikation,\n\nPostgreSQL \u2013 Datenbank, die in einem separaten Container l\u00E4uft.\n\nDiese drei Dienste sind f\u00FCr das ordnungsgem\u00E4\u00DFe Funktionieren des Gesamtsystems unverzichtbar \u2013 ihre Trennung und Containerisierung (Docker) erm\u00F6glicht eine einfachere Bereitstellung, Tests und unabh\u00E4ngige Entwicklung jedes einzelnen Bestandteils. Es wurden auch Caching-Mechanismen zur Leistungssteigerung implementiert (z.B. f\u00FCr Sitzungsdaten).\n\nAufgrund begrenzter Ressourcen musste ich vor\u00FCbergehend auf den Betrieb des Backends verzichten \u2013 EC2 verf\u00FCgt nicht \u00FCber ausreichend RAM.\n\nGern stelle ich Zugriff auf das private GitHub-Repository zur Verf\u00FCgung, um einen Einblick in den Code und die angewandten L\u00F6sungen zu erm\u00F6glichen.\nDas Projekt startete im M\u00E4rz 2025 \u2013 die Entwicklungs- und Optimierungsarbeiten sind im Gange.\nEntschuldigung f\u00FCr die Unannehmlichkeiten.
infoContent.systemDescription=Das System wurde auf einer Multi-Modul-Architektur entworfen, die eine klare Trennung von Verantwortlichkeiten und eine einfachere Codeverwaltung erm\u00F6glicht. Jedes Modul ist f\u00FCr einen klar definierten Funktionsbereich zust\u00E4ndig, wodurch eine unabh\u00E4ngige Entwicklung und Wartung einzelner Systemkomponenten erm\u00F6glicht wird. Dieser Ansatz f\u00F6rdert die Skalierbarkeit und langfristige Entwicklung des Projekts.
infoContent.vaadinDescription=In der Pr\u00E4sentationsschicht wird ein komponentenbasierter Ansatz mit dem Vaadin-Framework verwendet. Wichtige Benutzeransichten und Funktionen werden mit wiederverwendbaren Komponenten erstellt, die sowohl die Benutzeroberfl\u00E4chenlogik als auch ein konsistentes Erscheinungsbild enthalten. Dies erleichtert die Einhaltung eines einheitlichen Designs und beschleunigt die Implementierung neuer Funktionen.
infoContent.additionalDescription=Das System verwendet moderne Authentifizierungsmechanismen auf Basis von JWT-Tokens sowie effektives Caching, was zur Sicherheit und Leistungsf\u00E4higkeit der Anwendung beitr\u00E4gt.
infoContent.testsDescription=Schl\u00fcsselfunktionen des Systems werden kontinuierlich getestet und gewartet.
infoContent.moduleDescription=Eine Multimodul-Struktur erm\u00f6glicht eine bessere Abh\u00e4ngigkeitsverwaltung und sorgt f\u00fcr Konsistenz der L\u00f6sungen in unabh\u00e4ngigen Modulen.
infoContent.gitDescription=Das GitHub-Repository wird verwendet, um die Arbeit \u00fcber Aufgabenlisten (ToDo) und verkn\u00fcpfte Issues zu organisieren, was eine effiziente Synchronisierung und Fortschrittskontrolle erm\u00f6glicht.

homeContent.title=CrewOps \u2013 effizientes Management von Teams und Maschinen im Einsatz
homeContent.intro=Die Anwendung wurde entwickelt, um den Alltag technischer Teams zu erleichtern und die Verf\u00fcgbarkeit von schweren Maschinen auf Baustellen und in Industrieanlagen zu \u00fcberwachen.
homeContent.feature1=Personalverwaltung \u2013 Zuordnung von Mitarbeitern zu Schichten, Teams oder Maschinen. Das System erm\u00f6glicht die Verfolgung der Verf\u00fcgbarkeit in Echtzeit.
homeContent.feature2=Maschinen\u00fcberwachung und -erfassung \u2013 \u00dcberblick \u00fcber verf\u00fcgbare, zugewiesene oder au\u00dfer Betrieb genommene Maschinen.
homeContent.feature3=St\u00f6rungsmeldung \u2013 Benutzer k\u00f6nnen Maschinenfehler direkt \u00fcber die App melden. Jede Meldung wird protokolliert und der Reparaturverlauf kann nachverfolgt werden.
homeContent.feature4=Admin-Panel \u2013 vollst\u00e4ndige Kontrolle \u00fcber Benutzerrechte, Systemansichten und Protokolle.
homeContent.feature5=Derzeit \u00fcber den Webbrowser verf\u00fcgbar. Mobile Version f\u00fcr Smartphones \u2013 in Vorbereitung.
homeContent.loginInfo=Zugangsdaten \u2013 Demo-Konten:
homeContent.credentials=admin / admin<br>user / user<br><br>Beide Konten haben derzeit vollst\u00e4ndige Rechte zum Testen aller Systemfunktionen.

