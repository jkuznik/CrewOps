#   VIEWS

homeView.title=\uD83D\uDE80 CrewOps \u2013 manage your crew, fleet, and incidents in one place\n\nCrewOps is a modern web application designed for companies operating vehicles and technical teams. It enables efficient management of employees, vehicles, and real-time incident reports.\n\n\uD83D\uDC77\u200D\u2642\uFE0F Employee management \u2013 review qualifications and assign tasks.\n\uD83D\uDE9B Fleet tracking \u2013 monitor vehicles and their status.\n\u26A0\uFE0F Incident reporting and handling \u2013 register breakdowns and track repair progress.\n\uD83D\uDD10 Secure login and sessions \u2013 JWT token support and automatic logout after session expiration.\n\nCrewOps supports your team's daily operations, helping you focus on what truly matters.

