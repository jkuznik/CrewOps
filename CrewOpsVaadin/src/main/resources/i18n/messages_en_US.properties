#   CONTENTS
infoContent.systemDescription=The system was designed based on a multi-module architecture, enabling clear separation of responsibilities and easier code management. Each module is responsible for a clearly defined functional area, allowing independent work on different parts of the system and easy testing and maintenance. This approach supports scalability and long-term project development.
infoContent.vaadinDescription=The presentation layer uses a component-based approach built on the Vaadin framework. Key views and user functionalities are created with reusable components containing both interface logic and consistent appearance. This facilitates maintaining a uniform visual style and accelerates implementation of new features.
infoContent.additionalDescription=The system also implements modern authentication mechanisms based on JWT tokens and efficient caching, which contribute to application security and performance.
infoContent.testsDescription=Key system functions are continuously tested and maintained.
infoContent.moduleDescription=A multi-module structure enables better dependency management, ensuring solution consistency across independent modules.
infoContent.gitDescription=The GitHub repository is used to organize work through to-do lists and linked issues, enabling efficient synchronization and tracking of progress.

homeContent.title=CrewOps \u2013 efficient management of field teams and machinery
homeContent.intro=The application is designed to streamline the daily operations of technical crews and monitor the availability of heavy equipment.
homeContent.feature1=Team management \u2013 assign workers to specific shifts, teams, or machines. The system enables real-time tracking of staff availability.
homeContent.feature2=Machine monitoring and inventory \u2013 overview of currently available, assigned, or out-of-service machines.
homeContent.feature3=Fault reporting \u2013 users can report machine faults directly through the application. Each report is logged and its status and repair history can be tracked.
homeContent.feature4=Admin panel \u2013 full control over user permissions, system views, and activity logs.
homeContent.feature5=Currently available via web browser. Mobile version for smartphones \u2013 in development.
homeContent.loginInfo=Login data \u2013 sample accounts:
homeContent.credentials=admin / admin<br>user / user<br><br>Both accounts currently have full permissions, allowing testing of all system features.

